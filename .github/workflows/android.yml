name: Android preview APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm test
      - name: Prepare fixed release signing key
        env:
          STARLIGHT_SIGNING_BUNDLE: ${{ secrets.STARLIGHT_SIGNING_BUNDLE }}
        run: |
          test -n "$STARLIGHT_SIGNING_BUNDLE"
          mkdir -p "$RUNNER_TEMP/starlight-signing"
          printf '%s' "$STARLIGHT_SIGNING_BUNDLE" | base64 --decode > "$RUNNER_TEMP/starlight-signing.tgz"
          tar -xzf "$RUNNER_TEMP/starlight-signing.tgz" -C "$RUNNER_TEMP/starlight-signing"
          store_password="$(cat "$RUNNER_TEMP/starlight-signing/store_password")"
          key_password="$(cat "$RUNNER_TEMP/starlight-signing/key_password")"
          key_alias="$(cat "$RUNNER_TEMP/starlight-signing/alias")"
          echo "::add-mask::$store_password"
          echo "::add-mask::$key_password"
          {
            echo "STARLIGHT_KEYSTORE_PATH=$RUNNER_TEMP/starlight-signing/starlight-release.p12"
            echo "STARLIGHT_KEYSTORE_PASSWORD=$store_password"
            echo "STARLIGHT_KEY_ALIAS=$key_alias"
            echo "STARLIGHT_KEY_PASSWORD=$key_password"
          } >> "$GITHUB_ENV"
      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify bundled constellation artwork
        run: |
          python3 - <<'PYART'
          import json, pathlib, zipfile
          data=json.loads(pathlib.Path('app/src/main/assets/art-data.js').read_text().split('=',1)[1].strip().rstrip(';'))
          with zipfile.ZipFile('app/build/outputs/apk/release/app-release.apk') as apk:
              assert len(data)==85
              assert len(apk.read('assets/textures/moon.jpg'))>100000
              for item in data:
                  name='assets/art/'+item['file'].split('/')[-1]
                  assert len(apk.read(name))>0, name
          print('All 85 constellation images are bundled in APK')
          PYART
      - name: Verify release signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk > signing-verification.txt
          cat signing-verification.txt
          grep -Fq '3ea20712ab847ee5e2247cd5d4673bfa5a5467071a654e5e6066da42a4867558' signing-verification.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Starlight-signed-preview-APK
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Starlight-0.3.11-moon-detail.apk
          sha256sum Starlight-0.3.11-moon-detail.apk > SHA256SUMS
          if ! gh release view v0.3.11 >/dev/null 2>&1; then
            gh release create v0.3.11 Starlight-0.3.11-moon-detail.apk SHA256SUMS --target "$GITHUB_SHA" --prerelease --title 'Starlight 0.3.11 Moon surface detail' --notes-file RELEASE_NOTES.md
          fi
