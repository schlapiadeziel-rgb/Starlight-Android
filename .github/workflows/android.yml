name: Android preview APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Prepare verified offline Milky Way photograph
        run: python3 tools/prepare_milky_way.py
      - name: Prepare fixed release signing key
        env:
          STARLIGHT_SIGNING_BUNDLE: ${{ secrets.STARLIGHT_SIGNING_BUNDLE }}
        run: |
          test -n "$STARLIGHT_SIGNING_BUNDLE"
          mkdir -p "$RUNNER_TEMP/starlight-signing"
          printf '%s' "$STARLIGHT_SIGNING_BUNDLE" | base64 --decode > "$RUNNER_TEMP/starlight-signing.tgz"
          tar -xzf "$RUNNER_TEMP/starlight-signing.tgz" -C "$RUNNER_TEMP/starlight-signing"
          store_password="$(cat "$RUNNER_TEMP/starlight-signing/store_password")"
          key_password="$(cat "$RUNNER_TEMP/starlight-signing/key_password")"
          key_alias="$(cat "$RUNNER_TEMP/starlight-signing/alias")"
          echo "::add-mask::$store_password"
          echo "::add-mask::$key_password"
          {
            echo "STARLIGHT_KEYSTORE_PATH=$RUNNER_TEMP/starlight-signing/starlight-release.p12"
            echo "STARLIGHT_KEYSTORE_PASSWORD=$store_password"
            echo "STARLIGHT_KEY_ALIAS=$key_alias"
            echo "STARLIGHT_KEY_PASSWORD=$key_password"
          } >> "$GITHUB_ENV"
      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify bundled constellation artwork
        run: |
          python3 - <<'PYART'
          import json, pathlib, zipfile
          data=json.loads(pathlib.Path('app/src/main/assets/art-data.js').read_text().split('=',1)[1].strip().rstrip(';'))
          with zipfile.ZipFile('app/build/outputs/apk/release/app-release.apk') as apk:
              assert len(data)==85
              assert len(apk.read('assets/labels.js'))>100
              assert b'labels.js' in apk.read('assets/index.html')
              assert len(apk.read('assets/textures/moon.jpg'))>100000
              assert len(apk.read('assets/textures/sun.jpg'))>700000
              assert len(apk.read('assets/textures/jupiter.jpg'))>400000
              assert len(apk.read('assets/textures/saturn.jpg'))>190000
              assert b'saturn-surface.js' in apk.read('assets/index.html')
              assert b'deep-photo.js' in apk.read('assets/index.html')
              assert b'photo-view.js' in apk.read('assets/index.html')
              assert len(apk.read('assets/photo-view.js'))>1000
              assert b'anchoredView' in apk.read('assets/core.js')
              assert b'cancelSkyPointer' in apk.read('assets/app.js')
              assert b'function expanded' in apk.read('assets/art.js')
              assert b'[320,640,1024]' in apk.read('assets/deep-photo.js')
              assert b'milky-way.js' in apk.read('assets/index.html')
              assert len(apk.read('assets/milky-way.js'))>1000
              assert b'galaxy.js' in apk.read('assets/index.html')
              assert len(apk.read('assets/galaxy.js'))>4000
              assert len(apk.read('assets/textures/milky-way.jpg'))==4857484
              import hashlib
              assert hashlib.sha256(apk.read('assets/textures/milky-way.jpg')).hexdigest()=='5363732a1629eed9df2f707b31eaae6b117c0ee35d7cc8d6ddd636bc6512302d'
              assert b'ESO/S. Brunier' in apk.read('assets/textures/CREDITS.txt')
              assert len(apk.read('assets/deepsky/m31.jpg'))>100000
              assert len(apk.read('assets/deepsky/m42.jpg'))>100000
              assert len(apk.read('assets/deepsky/m8.jpg'))>100000
              assert len(apk.read('assets/deepsky/m33.jpg'))>100000
              assert b'NASA/JPL-Caltech' in apk.read('assets/deepsky/CREDITS.txt')
              assert b'PIA14728' in apk.read('assets/deepsky/CREDITS.txt')
              assert b'PIA03033' in apk.read('assets/deepsky/CREDITS.txt')
              assert b'Solar System Scope' in apk.read('assets/textures/CREDITS.txt')
              assert b'Jupiter atmospheric texture' in apk.read('assets/textures/CREDITS.txt')
              assert b'Saturn atmospheric texture' in apk.read('assets/textures/CREDITS.txt')
              for item in data:
                  name='assets/art/'+item['file'].split('/')[-1]
                  assert len(apk.read(name))>0, name
          print('All 85 constellation images are bundled in APK')
          PYART
      - name: Verify release signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk > signing-verification.txt
          cat signing-verification.txt
          grep -Fq '3ea20712ab847ee5e2247cd5d4673bfa5a5467071a654e5e6066da42a4867558' signing-verification.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Starlight-signed-preview-APK
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Starlight-0.3.26-milky-way-photo.apk
          python3 - <<'PYSOURCE'
          import pathlib, subprocess, zipfile
          names=[n.decode() for n in subprocess.check_output(['git','ls-files','-z']).split(b'\0') if n]
          names.append('app/src/main/assets/textures/milky-way.jpg')
          with zipfile.ZipFile('Starlight-0.3.26-source.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for name in names:
                  archive.write(name,'Starlight-0.3.26/'+name)
          PYSOURCE
          sha256sum Starlight-0.3.26-milky-way-photo.apk Starlight-0.3.26-source.zip > SHA256SUMS
          if ! gh release view v0.3.26 >/dev/null 2>&1; then
            gh release create v0.3.26 Starlight-0.3.26-milky-way-photo.apk Starlight-0.3.26-source.zip SHA256SUMS --target "$GITHUB_SHA" --prerelease --title 'Starlight 0.3.26 photographic Milky Way' --notes-file RELEASE_NOTES.md
          fi
