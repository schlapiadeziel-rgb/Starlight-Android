plugins { id 'com.android.application' }
android {
    namespace 'org.starlight.free'
    compileSdk 35
    defaultConfig {
        applicationId 'org.starlight.free'
        minSdk 26
        targetSdk 35
        versionCode 39
        versionName '0.3.27'
    }
    signingConfigs {
        release {
            def keystorePath = System.getenv('STARLIGHT_KEYSTORE_PATH')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('STARLIGHT_KEYSTORE_PASSWORD')
                keyAlias System.getenv('STARLIGHT_KEY_ALIAS')
                keyPassword System.getenv('STARLIGHT_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}


// Original licensed images are packaged unchanged; extract during Android builds.
def skyArtDir = layout.buildDirectory.dir('generated/skyArt')
tasks.register('unpackSkyArt', Sync) {
    from zipTree(file('artwork.zip'))
    into skyArtDir
}
android.sourceSets.main.assets.srcDir(skyArtDir)
tasks.named('preBuild').configure { dependsOn('unpackSkyArt') }

tasks.register('verifyMilkyWayPhoto') {
    doLast {
        def photo = file('src/main/assets/textures/milky-way.jpg')
        if (!photo.exists()) throw new GradleException('Run python3 tools/prepare_milky_way.py at the project root before building.')
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(photo.bytes).encodeHex().toString()
        if (digest != '5363732a1629eed9df2f707b31eaae6b117c0ee35d7cc8d6ddd636bc6512302d') {
            throw new GradleException('Milky Way photograph checksum does not match the licensed original.')
        }
    }
}
tasks.named('preBuild').configure { dependsOn('verifyMilkyWayPhoto') }
