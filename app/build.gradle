plugins { id 'com.android.application' }
android {
    namespace 'org.starlight.free'
    compileSdk 35
    defaultConfig {
        applicationId 'org.starlight.free'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.2.5'
    }
    signingConfigs {
        release {
            def keystorePath = System.getenv('STARLIGHT_KEYSTORE_PATH')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('STARLIGHT_KEYSTORE_PASSWORD')
                keyAlias System.getenv('STARLIGHT_KEY_ALIAS')
                keyPassword System.getenv('STARLIGHT_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
