<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#070d19"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>星野 · Starlight</title><link rel="stylesheet" href="style.css"></head>
<body><canvas id="sky" aria-label="交互星空，拖动旋转，双指缩放"></canvas>
<header><div class="brand"><span class="logo">✧</span><div><b>星野</b><small>STARLIGHT / FREE SKY</small></div></div><button id="loc" class="pill">◎ <span id="place">设置位置</span></button></header>
<div id="context"><span class="live-dot"></span><span id="mode">自由探索</span><span class="sep">/</span><span id="clock"></span></div>
<aside class="tools"><button id="focusMode" aria-label="开启净空观星" aria-pressed="false" title="收起控件，净空观星">净空</button><button id="ar" aria-label="相机 AR 叠加">AR</button><button id="track" aria-label="开启手机指向识星"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="7"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/><circle cx="12" cy="12" r="1.5"/></svg></button><button id="lines" class="active" aria-label="星座连线"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 17l5-11 6 9 5-10"/><circle cx="4" cy="17" r="1.4"/><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="15" r="1.4"/><circle cx="20" cy="5" r="1.4"/></svg></button><button id="grid" aria-label="天球参考线、J2000 赤道网格和视场圆环"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 8h16M4 16h16M8 4v16M16 4v16"/><circle cx="12" cy="12" r="10"/></svg></button><button id="night" aria-label="红色夜间模式"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 14.5A8.5 8.5 0 019.5 4 8.5 8.5 0 1020 14.5Z"/></svg></button><button id="zoomIn" aria-label="放大"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg></button><button id="zoomOut" aria-label="缩小"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12h14"/></svg></button><button id="calibrate" aria-label="方向校准" hidden><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/></svg></button><button id="help" aria-label="帮助与更新"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 8a4 4 0 118 1c0 2-4 2-4 5"/><path d="M12 18h.01"/></svg></button></aside>
<div id="heading"><b id="bearing">北 · 0°</b><span id="elevation">仰角 35°</span><span id="galaxyCredit" hidden>银河摄影 · ESO/S. Brunier</span></div>
<div id="target"></div><div id="guide" aria-hidden="true" hidden>➤</div><div id="hint">拖动探索星空 · 点击天体了解更多</div>
<footer><div id="selection" hidden></div><div class="timebar"><button id="earlier" aria-label="提前一小时">−1h</button><button id="time">◷ 现在</button><button id="later" aria-label="延后一小时">+1h</button></div><nav><button id="search"><span><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg></span>搜索天体</button><button id="tonight"><span><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m12 2 2.7 7.3L22 12l-7.3 2.7L12 22l-2.7-7.3L2 12l7.3-2.7Z"/></svg></span>观测计划</button><button id="saved"><span><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.5 5.5c-2.2-2.2-6-1.7-8.5 1.1-2.5-2.8-6.3-3.3-8.5-1.1C0 9 3 13 12 20c9-7 12-11 8.5-14.5Z"/></svg></span>观测收藏</button></nav></footer>
<dialog id="sheet"><div class="sheet-head"><h2 id="sheetTitle"></h2><button id="close" aria-label="关闭">×</button></div><div id="sheetBody"></div></dialog><div id="toast" role="status"></div>
