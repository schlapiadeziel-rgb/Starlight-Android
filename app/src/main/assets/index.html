<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#070d19"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>星野 · Starlight</title><link rel="stylesheet" href="style.css"></head>
<body><canvas id="sky" aria-label="交互星空，拖动旋转，双指缩放"></canvas>
<header><div class="brand"><span class="logo">✧</span><div><b>星野</b><small>STARLIGHT / FREE SKY</small></div></div><button id="loc" class="pill">◎ <span id="place">设置位置</span></button></header>
<div id="context"><span class="live-dot"></span><span id="mode">自由探索</span><span class="sep">/</span><span id="clock"></span></div>
<aside class="tools"><button id="ar" aria-label="相机 AR 叠加">AR</button><button id="track" aria-label="开启手机指向识星">⌖</button><button id="lines" class="active" aria-label="星座连线">✧</button><button id="grid" class="active" aria-label="赤道坐标网格和视场圆环">⌗</button><button id="night" aria-label="红色夜间模式">◐</button><button id="zoomIn" aria-label="放大">＋</button><button id="zoomOut" aria-label="缩小">−</button><button id="calibrate" aria-label="方向校准" hidden>⚙</button><button id="help" aria-label="帮助与更新">?</button></aside>
<div id="heading"><b id="bearing">北 · 0°</b><span id="elevation">仰角 35°</span></div>
<div id="target"></div><div id="guide" aria-hidden="true" hidden>➤</div><div id="hint">拖动探索星空 · 点击天体了解更多</div>
<footer><div id="selection" hidden></div><div class="timebar"><button id="earlier" aria-label="提前一小时">−1h</button><button id="time">◷ 现在</button><button id="later" aria-label="延后一小时">+1h</button></div><nav><button id="search"><span>⌕</span>搜索天体</button><button id="tonight"><span>✦</span>观测计划</button><button id="saved"><span>♡</span>观测收藏</button></nav></footer>
<dialog id="sheet"><div class="sheet-head"><h2 id="sheetTitle"></h2><button id="close" aria-label="关闭">×</button></div><div id="sheetBody"></div></dialog><div id="toast" role="status"></div>
<script src="astronomy.js"></script><script src="iss.js"></script><script src="stars-00.js"></script><script src="stars-01.js"></script><script src="stars-02.js"></script><script src="stars-03.js"></script><script src="stars-04.js"></script><script src="stars-05.js"></script><script src="stars-06.js"></script><script src="stars-07.js"></script><script src="stars-08.js"></script><script src="stars-09.js"></script><script src="stars-10.js"></script><script src="stars-11.js"></script><script src="stars-12.js"></script><script src="stars-13.js"></script><script src="stars-14.js"></script><script src="stars-15.js"></script><script src="messier.js"></script><script src="constellations.js"></script><script src="core.js"></script><script src="pose.js"></script><script src="visual.js"></script><script src="backup.js"></script><script src="planner.js"></script><script src="app.js"></script></body></html>
